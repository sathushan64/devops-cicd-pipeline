name: Build, Test & Deploy Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t devops-cicd-pipeline:latest .

      - name: Test Container Health Check
        run: |
          docker run -d -p 3000:3000 --name running-app devops-cicd-pipeline:latest
          sleep 5
          docker ps
          curl -f http://localhost:3000/health || exit 1
          docker logs running-app
          docker stop running-app